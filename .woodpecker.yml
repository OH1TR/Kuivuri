when:
  - event: [push, manual]
    branch: master

steps:
  # Kuivurin web-image yksityiseen rekisteriin. Osoite on TLS-paate registry.rouva.li
  # eika sisaverkon HTTP-osoite, koska buildkit ajaa omassa kontissaan eika peri
  # dockerd:n insecure-registries-listaa. Sama varasto molemmissa paissa.
  #
  # Tunnukset tulevat Woodpeckerin globaaleista salaisuuksista, ei repo-tasolta.
  #
  # Dockerfile kaantaa vain KuivuriWeb + CoreDto (net10.0). NetDto ja RaspiService
  # ovat yha .NET Framework 4.0:aa eivatka kuulu imageen.
  - name: kuivuri-image
    image: woodpeckerci/plugin-docker-buildx:6.1.1
    settings:
      registry: https://registry.rouva.li
      repo: registry.rouva.li/kuivuri
      # context on repon juuri, koska lahteet ovat DotNET/-kansiossa.
      dockerfile: docker/Dockerfile
      context: .
      platforms: linux/amd64
      tags:
        - latest
        - ${CI_COMMIT_SHA:0:8}
      username:
        from_secret: registry_user
      password:
        from_secret: registry_password
